# The judge runs locally, on the committer's own login, before every commit. A pull request is accepted
# only when every commit carries the record hickey wrote into its message. Seconds, no model.
# The site itself builds on Node 22 (see build.mjs); hickey needs 24, so this job alone runs on 24.
name: gate

on:
  pull_request:

jobs:
  carried:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Every commit carries the gate's record
        run: npx hickey carried "origin/${{ github.base_ref }}...HEAD"
